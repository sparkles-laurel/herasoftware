<style>
:root{--bg:#090817;--panel:#0c0b1b;--line:#302044;--pink:#ec45b5;--purple:#a72de0;--white:#f4f0ff;--muted:#b2aec7}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--white);font-family:Inter,Arial,sans-serif;background:radial-gradient(ellipse at 55% 34%,#35134d4a 0,transparent 42%),linear-gradient(110deg,#090817,#0b0a1d 60%,#090817);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#e94ebc 1px,transparent 1px);background-size:35px 35px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
.topbar{height:150px;border-bottom:1px solid #382044;background:#090817eF;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:0 5.4%;position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:13px;width:max-content}
.logo-mark{width:150px;height:150px;display:grid;place-items:center;color:var(--pink);font-size:49px;line-height:1;position:relative}
.logo-mark:before,.logo-mark:after{content:"";position:absolute;width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--pink),transparent);left:9px}
.logo-mark:before{top:17px}.logo-mark:after{bottom:15px}
.logo-word{font-family:"Space Grotesk",sans-serif;font-size:31px;letter-spacing:8px;font-weight:500;color:#e7a2e9;line-height:1}
.logo-sub{font-size:9px;letter-spacing:8px;color:#d9cce7;margin-top:7px}
.tagline{display:flex;align-items:center;justify-content:center;gap:20px;color:#a79abd;font-size:11px;letter-spacing:3px;white-space:nowrap}
.tagline:before,.tagline:after{content:"";height:1px;width:82px;background:#a83e9d}
.trust{text-align:right;color:#9e98b8;font-size:12px;white-space:nowrap}.trust b{color:var(--pink);font-weight:500;padding:0 5px}
main{max-width:1440px;margin:auto;padding:0 4.7%}
.hero{height:570px;position:relative;display:grid;grid-template-columns:40% 60%;align-items:center}
.character{
    position:absolute;
    left:-5.5%;
    bottom:0;
    width:48%;
    height:100%;
    background-image:linear-gradient(90deg,transparent 75%,#0b0a1d 100%),url("../img/bakimdayiz.png");
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
}
    .hero-copy{grid-column:2;position:relative;z-index:1;padding:25px 2% 30px 3%}
.pill{display:inline-flex;align-items:center;gap:12px;border:1px solid #bc38a8;border-radius:30px;padding:11px 19px;color:#f18bd5;font-size:13px;letter-spacing:.7px;font-weight:600;background:#100d25b8;box-shadow:0 0 22px #b52b9c13}
.pill svg{width:16px;height:16px;fill:#ed5cbf}
h1{font-size:clamp(31px,3.7vw,47px);font-weight:300;line-height:1.22;letter-spacing:-1.7px;margin:20px 0 25px}
h1 strong{display:block;color:#ed36b8;font-weight:800;letter-spacing:-1.9px}
.lead{font-size:17px;line-height:1.58;color:#c5c1d6;max-width:610px;font-weight:400}
.note{margin-top:24px;border-left:3px solid #dc4cb7;padding:2px 0 2px 18px;color:#c8c2d9;font-size:15px;line-height:1.55;font-style:italic;max-width:610px}
.flower{position:absolute;right:-1%;bottom:7px;width:205px;height:250px;opacity:.78;color:#a92cc3;pointer-events:none}
.flower svg{width:100%;height:100%;overflow:visible}
.info-grid{position:relative;z-index:2;border:1px solid #4a2561;border-radius:12px;background:linear-gradient(105deg,#0b0a1cf5,#0d0b20f5);min-height:290px;display:grid;grid-template-columns:repeat(4,1fr);padding:38px 0;box-shadow:0 15px 55px #03020b55}
.info{padding:8px 25px 0;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center}
.info:not(:last-child):after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:#29213b}
.info-icon{height:50px;color:#d94bbd;margin-bottom:18px}
.info-icon svg{width:43px;height:43px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.info h2{font-size:16px;font-weight:600;margin:0 0 18px}
.info p{font-size:13px;line-height:1.8;color:#b9b4cc;margin:0;max-width:230px}
.support{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:13px;padding:11px 17px;border:1px solid #d53cb5;border-radius:30px;background:linear-gradient(100deg,#2b103f,#6e087c);color:#f6eafa;text-decoration:none;font-size:12px;transition:.2s}
.support:hover{transform:translateY(-2px);box-shadow:0 7px 22px #c02ab344}
.support svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.closing{height:178px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#d6c8e5}
.closing-label{display:flex;align-items:center;gap:28px;font-size:12px;letter-spacing:6px;color:#d8cbe9}
.closing-label:before,.closing-label:after{content:"";height:1px;width:130px;background:linear-gradient(90deg,transparent,#df45b5)}
.closing-label:after{transform:rotate(180deg)}
.flower-dot{color:#e64bbd;font-size:20px;line-height:10px}
.signature{font-family:cursive;font-style:italic;font-size:24px;color:#e85ac5;transform:rotate(-7deg);letter-spacing:1px}
footer{height:112px;border-top:1px solid #35213f;display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:0 5.4%;color:#aaa4bf;background:#090817}
.footer-logo{display:flex;align-items:center;gap:10px}
.footer-logo .logo-mark{width:150px;height:150px;font-size:38px}
.footer-logo .logo-word{font-size:24px;letter-spacing:6px}
.footer-logo .logo-sub{font-size:7px;letter-spacing:6px}
.quote{text-align:center;color:#d25ac3;font-size:12px;font-style:italic}
.quote:after{content:"";display:block;width:45px;height:1px;background:#b83ca6;margin:15px auto 0}
.foot-right{text-align:right;font-size:12px}
.social{display:flex;justify-content:flex-end;gap:17px;margin-bottom:10px;color:#aa45c9}
.social a{color:inherit;text-decoration:none;font-weight:700;font-size:15px}
.foot-right a{color:#aaa4bf;text-decoration:none}
@media(max-width:800px){
 .topbar{height:74px;padding:0 5%;grid-template-columns:1fr auto}.tagline{display:none}.trust{font-size:10px}
 .logo-mark{width:49px;height:50px;font-size:38px}.logo-word{font-size:25px;letter-spacing:5px}.logo-sub{letter-spacing:5px;font-size:8px}
 main{padding:0 4%}.hero{height:auto;min-height:570px;grid-template-columns:1fr;align-items:end}
 .character{left:-5%;width:64%;height:100%;background-position:30% center;opacity:.58}
 .hero-copy{grid-column:1;padding:90px 3% 55px 36%;align-self:center}
 h1{font-size:clamp(28px,5vw,40px)}.lead{font-size:14px}.note{font-size:13px}
 .flower{width:125px;height:160px;right:0;bottom:8px;opacity:.45}
 .info-grid{grid-template-columns:repeat(2,1fr);padding:20px 0}
 .info{padding:22px 14px}.info:nth-child(2):after{display:none}
 .info:nth-child(-n+2){border-bottom:1px solid #29213b}
 .info h2{font-size:14px;margin-bottom:10px}.info p{font-size:12px}
 .closing{height:140px}.closing-label{font-size:10px;letter-spacing:3px;gap:12px}.closing-label:before,.closing-label:after{width:45px}
 footer{height:auto;min-height:100px;padding:18px 5%;grid-template-columns:1fr 1fr;row-gap:15px}
 .quote{grid-column:1/-1;grid-row:2;order:3}.foot-right{grid-column:2;grid-row:1}
}
@media(max-width:480px){
 .trust{display:none}.topbar{grid-template-columns:1fr}
 .hero{min-height:630px;align-items:end}
 .character{width:100%;height:67%;left:-8%;top:0;background-position:35% 25%;opacity:.48;mask-image:linear-gradient(to bottom,black 0%,black 65%,transparent 100%)}
 .hero-copy{padding:245px 3% 45px;align-self:end}
 .pill{font-size:11px;padding:9px 14px}h1{font-size:32px;margin:15px 0}
 .lead{font-size:14px}.note{font-size:12px;margin-top:16px}
 .flower{width:90px;height:125px;bottom:0}
 .info-grid{grid-template-columns:1fr;padding:8px 0}
 .info{padding:23px 18px}.info:not(:last-child):after{display:none}
 .info:not(:last-child){border-bottom:1px solid #29213b}
 .info-icon{margin-bottom:8px}.info h2{margin-bottom:8px}
 .info p{max-width:280px}
 .closing-label{font-size:9px;letter-spacing:2px}.closing-label:before,.closing-label:after{width:24px}
 footer{grid-template-columns:1fr 1fr}.footer-logo .logo-mark{width:40px;font-size:30px}
 .footer-logo .logo-word{font-size:19px;letter-spacing:4px}.footer-logo .logo-sub{font-size:6px;letter-spacing:4px}
}
</style>
</head>
<body>

<footer>

 </div>
